author: 'SAP Labs France Caen'
name: Wallbox-Shelly1PM
description: SAP e-Mobility Wallbox firmware for Shelly 1PM
version: 0.1.0
platform: esp8266

libs_version: ${mos.version}
modules_version: ${mos.version}
mongoose_os_version: ${mos.version}

# List of files / directories with C sources. No slashes at the end of dir names.
sources:
  - src

# List of dirs. Files from these dirs will be copied to the device filesystem
filesystem:
  - fs
  - dest/gzip

# Custom configuration entries, settable via "device configuration"
config_schema:
  - ["device.id", "wallbox-??????"]
  - ["wifi.ap.ssid", "Wallbox-Hotspot"]
  - ["wifi.ap.pass", "Wallbox1"]
  - ["device.sn", "000000"]
  - ["http.index_files", "index.html.gz,index.html"]
  - ["gpio", "o", {"GPIO settings"}]
  - ["gpio.relay", "i", 15, {"Relay pin"}]
  - ["gpio.cf", "i", 5, {"CF pin"}]
  - ["gpio.cf1", "i", 13, {"CF1 pin"}]
  - ["gpio.sel", "i", 12, {"SEL pin"}]
  - ["debug.level", 3]
  - ["ocpp", "o", {"OCPP settings"}]
  - ["ocpp.url", "s", "", {"Url of the OCPP Backend"}]
  - ["ocpp.name", "s", "", {"Name of the wallbox in OCPP Backend"}]
  - ["ocpp.transaction_id", "i", -1, {"Id of the current transaction"}]
  - ["ocpp.tag_id", "s", "", {"Tag used for the current transaction"}]
  - ["ocpp.config", "o", {"OCPP configuration"}]
  - ["ocpp.config.heartbeat_interval", "i", 180, {"Interval of inactivity with CS after which CP should send HB."}]

libs:
  - origin: https://github.com/mongoose-os-libs/mbedtls
    variant: esp8266-noatca
  - origin: https://github.com/mongoose-os-libs/mongoose
    variant: esp8266
  - origin: https://github.com/mongoose-os-libs/core
  - origin: https://github.com/mongoose-os-libs/rpc-service-config
  - origin: https://github.com/mongoose-os-libs/rpc-service-fs
  - origin: https://github.com/mongoose-os-libs/rpc-uart
  - origin: https://github.com/mongoose-os-libs/http-server
  - origin: https://github.com/mongoose-os-libs/rpc-ws
  - origin: https://github.com/mongoose-os-libs/ota-http-server
  - origin: https://github.com/mongoose-os-libs/ota-http-client
  - origin: https://github.com/mongoose-os-libs/rpc-service-ota
  - origin: https://github.com/mongoose-os-libs/wifi
  - origin: https://github.com/mongoose-os-libs/sntp
  # - origin: https://github.com/mongoose-os-libs/mjs
  - origin: https://github.com/ellavas/mongoose-lib-hlw8012
  # - origin: ../mongoose-lib-hlw8012
    name: hlw8012

build_vars:
  FLASH_SIZE: 2097152
  FS_SIZE: 262144
  BOOT_CONFIG_ADDR: 0x1000  # To be compatible with stock firmware.
  MGOS_ROOT_FS_TYPE: SPIFFS
  # We don't need the cryptochip support. Saves approx 12K flash.
  MGOS_MBEDTLS_ENABLE_ATCA: 0
cdefs:
  PRODUCT_VENDOR: '"Allterco"'
  SERVICE_NAME: '"Switch"'
  LED_GPIO: -1
  BTN_GPIO: -1
  PRODUCT_MODEL: '"Shelly1PM"'
  PRODUCT_HW_REV: '"1.0"'
  NUM_SWITCHES: 1
  # We don't use SSL, HomeKit uses its own crypto. This saves ~120K.
  MG_ENABLE_SSL: 1
  # This saves quite a bit of space but disables all HAP debug output.
  # HAP_LOG_LEVEL: 0

# Used by the mos tool to catch mos binaries incompatible with this file format
manifest_version: 2020-01-29
